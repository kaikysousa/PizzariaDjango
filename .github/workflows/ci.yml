name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes
        run: python manage.py test
        env:
          DJANGO_DEBUG: "1"
      - name: Gate de segredos
        run: python scripts/check_secrets.py
      - name: Gate de seguranca
        run: python scripts/check_security.py
      - name: Gate de deploy
        run: python scripts/check_deploy.py
      - name: Lint
        run: python -m ruff check .
